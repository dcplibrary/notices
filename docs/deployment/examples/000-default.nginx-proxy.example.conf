<VirtualHost *:80>
    ServerAdmin admin@example.org
    DocumentRoot /var/www/public

    # Leave ServerName unset here. Host routing is handled dynamically by
    # jwilder/nginx-proxy based on VIRTUAL_HOST / Docker metadata.

    <Directory /var/www/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Running behind nginx-proxy means TLS is terminated upstream.
    # Laravel should still see HTTPS via forwarded headers.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
