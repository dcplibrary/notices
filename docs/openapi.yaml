openapi: 3.0.3
info:
  title: Notices Package API
  description: |
    API endpoints for the Notices package. These endpoints return JSON responses
    suitable for use with external dashboards or API clients.
    
    All endpoints require authentication via the `api` middleware.
    The host application should configure API authentication (e.g., Sanctum, Passport).
  version: 1.0.0
  contact:
    name: DCPL Development Team
    email: staff@example.org

servers:
  # Use a relative server URL so Swagger UI uses the current origin (host + port),
  # e.g. http://localhost:8000, which avoids hardcoding ports in the spec.
  - url: /api/v1/notices
    description: Current server (recommended for local/dev)
  - url: https://your-domain.com/api/v1/notices
    description: Production server (replace with your real domain)

tags:
  - name: Dashboard
    description: Dashboard statistics and overview data
  - name: Notifications
    description: Notification management and queries
  - name: Issues
    description: Delivery issue tracking and resolution
  - name: Failed Contacts
    description: Failed email/phone contact management
  - name: Search
    description: Global search functionality

paths:
  /dashboard:
    get:
      tags:
        - Dashboard
      summary: Get comprehensive dashboard data
      description: Returns comprehensive dashboard data including statistics, confirmations, orphaned notifications, import status, and failed contacts.
      operationId: getDashboard
      parameters:
        - name: date_from
          in: query
          description: Start date in Y-m-d format. Defaults to yesterday.
          required: false
          schema:
            type: string
            format: date
            example: "2026-01-13"
        - name: date_to
          in: query
          description: End date in Y-m-d format. Defaults to yesterday.
          required: false
          schema:
            type: string
            format: date
            example: "2026-01-13"
        - name: quick_range
          in: query
          description: Quick filter option
          required: false
          schema:
            type: string
            enum: [yesterday, today, last_7_days, last_30_days, custom]
        - name: orphaned_days
          in: query
          description: Days to look back for orphaned notifications
          required: false
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /dashboard/stats:
    get:
      tags:
        - Dashboard
      summary: Get dashboard statistics only
      description: Returns date range statistics without other dashboard data.
      operationId: getDashboardStats
      parameters:
        - name: date_from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /dashboard/import-status:
    get:
      tags:
        - Dashboard
      summary: Get import status
      description: Returns current import status and schedule adherence.
      operationId: getImportStatus
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications:
    get:
      tags:
        - Notifications
      summary: List notifications
      description: Returns paginated list of notifications with filtering and search.
      operationId: listNotifications
      parameters:
        - name: search
          in: query
          description: Search term (searches patron barcode, notification type, etc.)
          required: false
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [pending, delivered, failed, skipped]
        - name: notification_type
          in: query
          schema:
            type: string
        - name: delivery_option_id
          in: query
          schema:
            type: integer
        - name: patron_barcode
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            default: first_exported_at
        - name: dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/{id}:
    get:
      tags:
        - Notifications
      summary: Get notification details
      description: Returns detailed information for a specific notification.
      operationId: getNotification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/patron/{barcode}:
    get:
      tags:
        - Notifications
      summary: Get patron notification history
      description: Returns all notifications for a specific patron.
      operationId: getPatronNotifications
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatronNotificationsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /issues:
    get:
      tags:
        - Issues
      summary: List delivery issues
      description: Returns paginated list of delivery issues with filtering.
      operationId: listIssues
      parameters:
        - name: type
          in: query
          description: Issue type filter (failed_contacts for failed delivery strings, or leave empty for patron delivery issues)
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: delivery_option_id
          in: query
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
            default: detected_at
        - name: dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIssuesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /issues/{id}:
    get:
      tags:
        - Issues
      summary: Get issue details
      description: Returns detailed information for a specific issue.
      operationId: getIssue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /issues/{id}/resolve:
    post:
      tags:
        - Issues
      summary: Resolve a single issue
      description: |
        Resolves a PatronDeliveryIssue by id.
        Requires a Sanctum token with ability `issues:write` (or `*`).
      operationId: resolveIssue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_notes]
              properties:
                resolution_notes:
                  type: string
      responses:
        '200':
          description: Resolution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  issue_id:
                    type: integer
                  resolved_at:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)
        '422':
          description: Validation error

  /issues/statistics:
    get:
      tags:
        - Issues
      summary: Get issue statistics
      description: Returns summary statistics for delivery issues.
      operationId: getIssueStatistics
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueStatisticsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /issues/bulk-resolve:
    post:
      tags:
        - Issues
      summary: Bulk resolve issues
      description: |
        Resolves multiple issues using one of:
        - `time_window`: resolves issues detected within a time window on a date
        - `patron`: resolves issues for a patron barcode
        - `notifications`: resolves issues tied to specific notification IDs
        
        Requires a Sanctum token with ability `issues:write` (or `*`).
      operationId: bulkResolveIssues
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, resolution_notes]
              properties:
                type:
                  type: string
                  enum: [time_window, patron, notifications]
                resolution_notes:
                  type: string
                date:
                  type: string
                  format: date
                start_time:
                  type: string
                  example: "08:00"
                end_time:
                  type: string
                  example: "09:30"
                patron_barcode:
                  type: string
                notification_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Bulk resolution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  resolved_count:
                    type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)
        '422':
          description: Validation error

  /failed-contacts:
    get:
      tags:
        - Failed Contacts
      summary: List failed contacts
      description: Returns paginated list of failed delivery strings (emails/phones).
      operationId: listFailedContacts
      parameters:
        - name: resolved
          in: query
          description: Include resolved contacts
          schema:
            type: boolean
            default: false
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFailedContactsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /failed-contacts/{id}:
    get:
      tags:
        - Failed Contacts
      summary: Get failed contact details
      description: Returns detailed information for a specific failed contact.
      operationId: getFailedContact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Can be numeric ID or 'mismatched_{id}' format
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /failed-contacts/{id}/resolve:
    post:
      tags:
        - Failed Contacts
      summary: Resolve a failed contact (or mismatched preference issue)
      description: |
        Resolves an aggregated failed contact (FailedDeliveryString) by ID.
        Also supports resolving mismatched preference issues using an id like `mismatched_123`.
        
        Requires a Sanctum token with ability `issues:write` (or `*`).
      operationId: resolveFailedContact
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: FailedDeliveryString id (numeric) OR `mismatched_{issueId}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_notes]
              properties:
                patron_barcode:
                  type: string
                  nullable: true
                patron_first_name:
                  type: string
                  nullable: true
                patron_last_name:
                  type: string
                  nullable: true
                resolution_type:
                  type: string
                  nullable: true
                  enum: [updated_phone, changed_to_email, changed_to_mail, other]
                resolution_notes:
                  type: string
      responses:
        '200':
          description: Resolution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  type:
                    type: string
                    enum: [failed_delivery_string, mismatched_preference]
                  failed_delivery_string_id:
                    type: integer
                    nullable: true
                  issue_id:
                    type: integer
                    nullable: true
                  resolved_at:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)
        '422':
          description: Validation error

  /failed-contacts/counts:
    get:
      tags:
        - Failed Contacts
      summary: Get failed contact counts by channel
      description: Returns counts of failed contacts grouped by delivery channel.
      operationId: getFailedContactCounts
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailedContactCountsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /orphaned-notifications:
    get:
      tags:
        - Dashboard
      summary: Get orphaned notifications
      description: Returns orphaned notification analysis (Polaris → LX Starter failures).
      operationId: getOrphanedNotifications
      parameters:
        - name: days
          in: query
          description: Days to look back
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /search:
    get:
      tags:
        - Search
      summary: Global search
      description: Global search across notifications, issues, and failed contacts.
      operationId: globalSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/import:
    post:
      tags:
        - Admin
      summary: Run full notices pipeline (notices:import)
      description: |
        Runs `php artisan notices:import` on the server.
        Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminRunImport
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  nullable: true
                from:
                  type: string
                  format: date
                  nullable: true
                to:
                  type: string
                  format: date
                  nullable: true
                days:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 365
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  queued: { type: boolean }
                  job_run_id: { type: integer }
                  status: { type: string }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/import-confirmations:
    post:
      tags:
        - Admin
      summary: Run confirmations import (notices:import-confirmations)
      description: Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminRunImportConfirmations
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  nullable: true
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  queued: { type: boolean }
                  job_run_id: { type: integer }
                  status: { type: string }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/process-orphaned:
    post:
      tags:
        - Admin
      summary: Run orphaned processing (notices:process-orphaned)
      description: Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminRunProcessOrphaned
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 365
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  queued: { type: boolean }
                  job_run_id: { type: integer }
                  status: { type: string }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/integrity-check:
    post:
      tags:
        - Admin
      summary: Run integrity check (notices:integrity-check)
      description: Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminRunIntegrityCheck
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 365
                fix:
                  type: boolean
                  nullable: true
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  queued: { type: boolean }
                  job_run_id: { type: integer }
                  status: { type: string }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/cleanup-import-logs:
    post:
      tags:
        - Admin
      summary: Cleanup cached import/export files (notices:cleanup-import-logs)
      description: Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminRunCleanupImportLogs
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 365
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  queued: { type: boolean }
                  job_run_id: { type: integer }
                  status: { type: string }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/job-runs:
    get:
      tags:
        - Admin
      summary: List recent job runs
      description: Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminListJobRuns
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Job runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/job-runs/{id}:
    get:
      tags:
        - Admin
      summary: Get a single job run
      description: Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminGetJobRun
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Job run
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/job-runs/{id}/events:
    get:
      tags:
        - Admin
      summary: Poll job run events/logs (incremental)
      description: |
        Polling-friendly endpoint to fetch new activity log rows since the last seen ids.
        Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminGetJobRunEvents
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: since_activity_log_id
          in: query
          schema:
            type: integer
            default: 0
        - name: since_user_activity_log_id
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: New events since last ids
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/job-runs/{id}/cancel:
    post:
      tags:
        - Admin
      summary: Request cancellation of a job run (best-effort)
      description: |
        Sets `cancel_requested=true` on the JobRun meta. Jobs will stop at safe checkpoints
        (between steps). This cannot reliably interrupt an Artisan command already executing.
        
        Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminCancelJobRun
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cancel requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  job_run_id: { type: integer }
                  status: { type: string }
                  cancel_requested: { type: boolean }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/lookup-overrides:
    get:
      tags:
        - Admin
      summary: List lookup table overrides
      description: |
        Lists overrides for lookup tables (delivery options / notification types).
        Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminListLookupOverrides
      security:
        - bearerAuth: []
      parameters:
        - name: table_name
          in: query
          required: false
          schema:
            type: string
            enum: [notification_types, delivery_options]
      responses:
        '200':
          description: Overrides
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)
    post:
      tags:
        - Admin
      summary: Upsert a lookup table override
      description: Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminUpsertLookupOverride
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table_name, record_id, is_enabled]
              properties:
                table_name:
                  type: string
                  enum: [notification_types, delivery_options]
                record_id:
                  type: integer
                custom_label:
                  type: string
                  nullable: true
                is_enabled:
                  type: boolean
                notes:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Upserted override
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)
        '422':
          description: Validation error

  /admin/lookup-overrides/{id}:
    delete:
      tags:
        - Admin
      summary: Delete a lookup table override
      description: Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminDeleteLookupOverride
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/ui-messages:
    get:
      tags:
        - Admin
      summary: List UI messages (defaults + overrides)
      description: Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminListUiMessages
      security:
        - bearerAuth: []
      responses:
        '200':
          description: UI messages
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/ui-messages/{key}:
    put:
      tags:
        - Admin
      summary: Upsert a UI message override
      description: Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminUpsertUiMessage
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                label:
                  type: string
                  nullable: true
                notes:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Upserted
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)
    delete:
      tags:
        - Admin
      summary: Delete a UI message override (revert to default)
      description: Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminDeleteUiMessage
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/activity/notifications:
    get:
      tags:
        - Admin
      summary: List notification activity logs
      description: |
        Returns pipeline/reconciliation events from `notification_activity_logs`.
        Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminListNotificationActivityLogs
      security:
        - bearerAuth: []
      parameters:
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
        - name: job_run_id
          in: query
          schema: { type: integer }
        - name: per_page
          in: query
          schema: { type: integer, default: 50 }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Paginated activity logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationActivityLogsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/activity/users:
    get:
      tags:
        - Admin
      summary: List user activity logs
      description: |
        Returns user-driven actions from `user_activity_logs`.
        Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminListUserActivityLogs
      security:
        - bearerAuth: []
      parameters:
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: search
          in: query
          schema: { type: string }
        - name: job_run_id
          in: query
          schema: { type: integer }
        - name: per_page
          in: query
          schema: { type: integer, default: 50 }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Paginated user activity logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserActivityLogsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)

  /admin/activity/system:
    get:
      tags:
        - Admin
      summary: List system activity logs
      description: |
        Returns system-level activity from `activity_log` (defaults to cleanup-related events).
        Requires Sanctum token ability `admin:maintenance` (or `*`).
      operationId: adminListSystemActivityLogs
      security:
        - bearerAuth: []
      parameters:
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: search
          in: query
          schema: { type: string }
        - name: action
          in: query
          description: Action prefix filter (e.g. cleanup.import_logs)
          schema: { type: string }
        - name: per_page
          in: query
          schema: { type: integer, default: 50 }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Paginated system activity logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSystemActivityLogsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (missing token ability)
        '422':
          description: Validation error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        API authentication using Bearer token.
        Configure authentication in your Laravel application (e.g., Sanctum, Passport).

  schemas:
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        from:
          type: integer
          nullable: true
        to:
          type: integer
          nullable: true

    NotificationActivityLogItem:
      type: object
      properties:
        id:
          type: integer
        occurred_at:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        meta:
          type: object
          nullable: true
        job_run_id:
          type: integer
          nullable: true
        notification:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            patron_barcode:
              type: string
              nullable: true
            status:
              type: string
              nullable: true
            delivery_option_id:
              type: integer
              nullable: true
            notification_type:
              type: string
              nullable: true
        activity_file:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            original_name:
              type: string
              nullable: true
            path:
              type: string
              nullable: true

    PaginatedNotificationActivityLogsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationActivityLogItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    UserActivityLogItem:
      type: object
      properties:
        id:
          type: integer
        occurred_at:
          type: string
          format: date-time
          nullable: true
        action:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        meta:
          type: object
          nullable: true
        user_id:
          type: integer
          nullable: true
        user_type:
          type: string
          nullable: true
        notification_id:
          type: integer
          nullable: true
        job_run_id:
          type: integer
          nullable: true
        job_run:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            job_name:
              type: string
              nullable: true
            status:
              type: string
              nullable: true

    PaginatedUserActivityLogsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserActivityLogItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    SystemActivityLogItem:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
        action:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        meta:
          type: object
          nullable: true
        subject_type:
          type: string
          nullable: true
        subject_id:
          type: integer
          nullable: true
        user_type:
          type: string
          nullable: true
        user_id:
          type: integer
          nullable: true

    PaginatedSystemActivityLogsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SystemActivityLogItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    DashboardResponse:
      type: object
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        quick_range:
          type: string
        orphaned_days:
          type: integer
        statistics:
          $ref: '#/components/schemas/StatisticsResponse'
        confirmations:
          type: object
        orphaned_notifications:
          type: object
        import_status:
          $ref: '#/components/schemas/ImportStatusResponse'
        failed_contact_counts:
          type: object
        failed_contacts_sms_voice:
          type: array
          items:
            type: object
        failed_contacts_email:
          type: array
          items:
            type: object

    StatisticsResponse:
      type: object
      properties:
        totals:
          type: object
          properties:
            total:
              type: integer
            delivered:
              type: integer
            failed:
              type: integer
            pending:
              type: integer
            success_rate:
              type: number
              format: float
        by_type:
          type: object
        by_delivery_option:
          type: object

    ImportStatusResponse:
      type: object
      properties:
        last_imports:
          type: object
        schedule_status:
          type: string
        failed_files:
          type: array
          items:
            type: string

    PaginatedNotificationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'

    Notification:
      type: object
      properties:
        id:
          type: integer
        patron_barcode:
          type: string
          nullable: true
        notification_type:
          type: string
          nullable: true
        delivery_option_id:
          type: integer
          nullable: true
        status:
          type: string
        first_exported_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        failed_at:
          type: string
          format: date-time
          nullable: true

    NotificationDetailResponse:
      type: object
      properties:
        id:
          type: integer
        patron_barcode:
          type: string
        patron_name:
          type: string
          nullable: true
        notification_type:
          type: string
        delivery_option:
          type: string
        status:
          type: string
        first_exported_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        active_issues:
          type: array
          items:
            type: object
        sources:
          type: object
        activity_log:
          type: array
          items:
            type: object

    PatronNotificationsResponse:
      type: object
      properties:
        patron_barcode:
          type: string
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'

    PaginatedIssuesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'

    IssueStatisticsResponse:
      type: object
      properties:
        total_issues:
          type: integer
        by_type:
          type: object

    PaginatedFailedContactsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'

    FailedContactCountsResponse:
      type: object
      properties:
        sms:
          type: object
          properties:
            count:
              type: integer
            affected_patrons:
              type: integer
        voice:
          type: object
          properties:
            count:
              type: integer
            affected_patrons:
              type: integer
        email:
          type: object
          properties:
            count:
              type: integer
            affected_patrons:
              type: integer

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              label:
                type: string
              description:
                type: string
              location:
                type: string
              url:
                type: string

    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true

    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object

  responses:
    BadRequestError:
      description: Bad request - invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnauthorizedError:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - bearerAuth: []
